  };
  draw();
}
function atCDD(el){
  const C=[
    {t:'<b>Article 1.</b> Entre l’association Les Charmilles, représentée par Mme Claire Vasseur, et M. Lucas Moreau, aide à domicile.', bad:false, e:'Les parties sont bien identifiées.'},
    {t:'<b>Article 2.</b> M. Lucas Moreau est engagé à durée déterminée en qualité d’aide à domicile.', bad:true, e:'Le motif manque ! Il faut écrire « remplacement de Mme Inès Durand, aide à domicile, absente pour congé de maternité ». Sans motif précis, le CDD est réputé conclu pour une durée indéterminée (art. L1242-12).'},
    {t:'<b>Article 3.</b> Le contrat débute le 1er mars et prendra fin « jusqu’à nouvel ordre de la direction ».', bad:true, e:'Le terme est imprécis. Un CDD de remplacement doit fixer une date de fin ou une durée minimale (par exemple jusqu’au retour de la salariée remplacée).'},
    {t:'<b>Article 4.</b> Le contrat comporte une période d’essai d’un mois.', bad:true, e:'Trop long : pour un CDD de moins de six mois, la période d’essai est limitée à un jour par semaine, dans la limite de deux semaines (art. L1242-10).'},
    {t:'<b>Article 5.</b> La convention collective applicable est celle de la branche de l’aide, de l’accompagnement, des soins et des services à domicile (IDCC 2941).', bad:false, e:'Mention correcte et obligatoire.'},
    {t:'<b>Article 6.</b> À la fin du contrat, M. Moreau percevra une indemnité de fin de contrat égale à 10 % de sa rémunération brute totale.', bad:false, e:'Conforme à l’article L1243-8.'}
  ];
  const flags={};
  const draw=(checked)=>{
    const found=C.filter((c,i)=>c.bad&&flags[i]).length, wrong=C.filter((c,i)=>!c.bad&&flags[i]).length;
    el.innerHTML=`<div class="card"><div class="doc" style="box-shadow:none;padding:0;max-width:none"><h3 style="font-family:var(--f-display)">Projet de contrat à durée déterminée</h3>${C.map((c,i)=>`<button class="clause ${checked&&flags[i]?(c.bad?'flag-ok':'flag-ko'):''} ${!checked&&flags[i]?'flag-ko':''}" data-c="${i}" aria-pressed="${!!flags[i]}">${c.t}${checked&&(flags[i]||c.bad)?`<div style="font-family:var(--f-body);font-size:14.5px;margin-top:6px">${c.bad?(flags[i]?'Bien vu : ':'Erreur oubliée : '):'Cette clause est correcte : '}${c.e}</div>`:''}</button>`).join('')}</div></div>

}
function atPyramide(el){
  const ORDER=['Code du travail','Convention collective de branche','Accord d’entreprise','Règlement intérieur','Contrat de travail'];
  let pool=[...ORDER].sort(()=>Math.random()-.5), placed=[];
  const SIT=[
    {q:'Le Code du travail accorde 30 jours ouvrables de congés payés par an. Ton contrat en prévoit 20. Combien en as-tu ?', a:'30 jours : le contrat ne peut pas retirer un droit garanti par le Code du travail.'},
    {q:'La convention collective prévoit une prime que la loi n’impose pas. Ton employeur doit-il la verser ?', a:'Oui : la convention collective s’applique à ton contrat et peut être plus favorable que la loi.'},
    {q:'Le règlement intérieur interdit d’accepter de l’argent des bénéficiaires. Ton contrat n’en parle pas. Dois-tu respecter cette règle ?', a:'Oui : le règlement intérieur s’impose à tous les salariés, même si le contrat n’en parle pas (ton contrat y renvoie d’ailleurs à l’article 2).'}
  ];

    const done=placed.length===ORDER.length, ok=done&&placed.every((x,i)=>x===ORDER[i]);
    el.innerHTML=`<div class="grid g2"><div class="card"><h3 style="font-size:16px">Les sources à placer</h3><div class="order-pool">${pool.map((s,i)=>`<button data-p="${i}">${s}</button>`).join('')||'<span class="muted">Toutes les sources sont placées.</span>'}</div><button class="btn ghost small" id="pyrreset" style="margin-top:10px">Recommencer</button></div>
    <div class="card"><h3 style="font-size:16px">Ma pyramide (du haut vers le bas)</h3><div class="pyr">${ORDER.map((_,i)=>{ const s=placed[i]; const good=done?(s===ORDER[i]):null; return `<div style="width:${46+i*13.5}%;background:${s?(good===null?'var(--c)':good?'var(--ok)':'var(--bad)'):'var(--line)'};color:${s?'#fff':'var(--muted)'}">${s||'…'}</div>`; }).join('')}</div>${done?`<p><b>${ok?'Parfait ! Ta pyramide est juste.':'Quelques sources sont mal placées (en rouge). Recommence.'}</b></p>`:''}</div></div>
    <div class="section-title"><h2>Trois situations</h2></div>
    <div class="grid">${SIT.map((s,i)=>`<div class="qcard"><div class="qn">Situation ${i+1}</div><h4>${s.q}</h4><details><summary style="cursor:pointer;font-weight:700;color:var(--c)">Voir la réponse</summary><p class="exp" style="margin-top:8px">${s.a}</p></details></div>`).join('')}</div>`;
    $$('[data-p]',el).forEach(b=>b.addEventListener('click',()=>{ placed.push(pool[+b.dataset.p]); pool.splice(+b.dataset.p,1); draw(); if(placed.length===ORDER.length && placed.every((x,i)=>x===ORDER[i])) burst(); }));
    $('#pyrreset',el).addEventListener('click',()=>{ pool=[...ORDER].sort(()=>Math.random()-.5); placed=[]; draw(); });
  };
  draw();
}
function atPaie(el){

  };
  draw();
}

function lexQuiz(box){
  const all=LEX.flatMap(c=>c.t); const pick=all[Math.floor(Math.random()*all.length)];

  $$('.opt',box).forEach(b=>b.addEventListener('click',()=>{ const ok=opts[+b.dataset.j]===pick; $$('.opt',box).forEach((x,j)=>{ x.disabled=true; if(opts[j]===pick) x.classList.add('good'); }); if(!ok) b.classList.add('bad'); else { const r=b.getBoundingClientRect(); burst(r.left+40,r.top,30); }

}

  ['Vérifier le motif d’un CDI, CDD, CTT',['Contrat inadapté.','Contrat adapté, motif absent.','Contrat et motif corrects.','Contrat, motif et article justifiés, piège repéré.']],
  ['Repérer les règles applicables',['Sources non identifiées.','Quelques sources citées.','Hiérarchie respectée et appliquée.','Hiérarchie appliquée à des cas, clauses illégales justifiées.']],
  ['Droits et obligations',['Obligations non repérées.','Obligations listées sans source.','Obligations classées et sourcées.','Lien fait avec le métier (bientraitance, sécurité).']],
  ['Durée du travail et paie',['Calculs absents ou faux.','Calculs partiellement justes.','Calculs justes et détaillés.','Calculs justes, anomalies repérées et démarche adaptée.']],
  ['Modalités de rupture',['Modes confondus.','Modes repérés, conséquences floues.','Modes et conséquences exacts.','Modes, conséquences et documents exacts, lettre soignée.']]
];

  <div class="tbl-wrap"><table class="form" style="min-width:820px"><thead><tr><th>Capacité du programme</th>${LV.map((l,i)=>`<th style="color:${LVC[i]}">${l}</th>`).join('')}</tr></thead><tbody>
  ${GRILLE.map(([t,ls])=>`<tr><td class="rl" style="white-space:normal;width:190px">${t}</td>${ls.map(x=>`<td style="padding:12px 10px;font-size:14.5px">${x}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  <div class="section-title"><h2>Espace professeur</h2></div>
  <div class="grid g2">
   <div class="card" style="display:grid;gap:10px;align-content:start"><h3 style="margin:0"><span class="ic">${I.target}</span>Afficher les corrigés</h3>
    <p class="muted">Avec le code professeur, les corrigés apparaissent sous chaque partie des annexes et de l’étude de cas, sur cet appareil uniquement.</p>
    <div id="profz">${document.body.classList.contains('prof')?`<button class="btn" id="profoff">Masquer les corrigés</button>`:`<div class="calc"><input type="password" id="pcode" placeholder="Code professeur" aria-label="Code professeur" autocomplete="off"><button class="btn small" id="pgo">Afficher</button><span class="fb ko" id="pfb"></span></div>`}</div></div>
   <div class="card" style="display:grid;gap:10px;align-content:start"><h3 style="margin:0"><span class="ic">${I.people}</span>Consulter le travail d’un élève</h3>
    <p class="muted">Collez le code de sauvegarde envoyé par l’élève. Son travail s’affiche sans modifier les réponses de cet ordinateur.</p>
    <textarea id="tcode" rows="3" placeholder="SIGNE-P1-…" aria-label="Code de sauvegarde de l’élève" style="font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)"></textarea>
    <div><button class="btn" id="tgo">Afficher le travail ${I.arrow}</button></div></div>

  const pz=$('#profz',v);
  const off=$('#profoff',v); if(off) off.addEventListener('click',()=>{ setProf(false); vEval(v); });
  const pg=$('#pgo',v); if(pg){ const tryCode=()=>{ if(($('#pcode',v).value||'').trim().toUpperCase()===CODE_PROF){ setProf(true); toast('Corrigés affichés sur cet appareil.'); vEval(v); } else { $('#pfb',v).textContent='Code incorrect'; } }; pg.addEventListener('click',tryCode); $('#pcode',v).addEventListener('keydown',e=>{ if(e.key==='Enter') tryCode(); }); }
  $('#tgo',v).addEventListener('click',async()=>{
    const box=$('#tbox',v); let f;
    try{ f=await unpackCode($('#tcode',v).value); }catch(e){ box.innerHTML='<p class="muted" style="margin-top:10px">Code non valide : vérifiez qu’il a été copié en entier.</p>'; return; }
    const res=withState(f,()=>({name:F('eleve_nom')||'Élève', classe:F('eleve_classe'), pct:overallPct(), text:allText(), rows:M.map(m=>{ const q=quizState(m), mean=autoMean(m); return [m.n,annexePct(m),`${q.good}/${q.total}`,mean!==null?LV[Math.round(mean)]+' (moyenne)':'—']; })}));
    box.innerHTML=`<div class="card" style="display:grid;gap:12px;margin-top:16px"><h3 style="margin:0">${esc(res.name)}${res.classe?', '+esc(res.classe):''} : ${res.pct} % de progression</h3>

     <textarea readonly rows="14" aria-label="Travail complet de l’élève" style="font:inherit;font-size:13.5px;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)">${esc(res.text)}</textarea>
     <div><button class="btn small" id="tcp">${I.copy} Copier le travail complet</button></div></div>`;

/* ═══════════ SAUVEGARDE ═══════════ */
function allText(){
  return `SIGNÉ ! MON PREMIER CONTRAT DE TRAVAIL – ${F('eleve_nom')} – ${F('eleve_classe')}\n\n`+M.map(m=>{ const A=m.auto; const ae=[`AUTOÉVALUATION – MISSION ${m.n}`,...A.crit.map((c,i)=>{ const x=F(`ae_${m.id}_c${i}`); return `${c.t} : ${x===''?'—':LV[+x]}`; }),...A.bilan.map(b=>`${b.l} : ${F(b.k)}`)]; const q=quizState(m); return annexeText(m)+`\nDÉFI : ${q.good}/${q.total}\n\n`+ae.join('\n'); }).join('\n\n════════════════════\n\n')
   +`\n\n════════════════════\n\nENTRAÎNEMENT – ÉTUDE DE CAS\n`+[1,2,3,4,5].map(i=>`Question ${i} : ${F('tr_'+i)}`).join('\n');
}
const b64u=bytes=>{ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u=str=>{ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; const bin=atob(str); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
async function packState(){
  const f={}; for(const [k,v] of Object.entries(S.f)) if(v!=='' && v!==false && v!==undefined) f[k]=v;
  let bytes=new TextEncoder().encode(JSON.stringify({v:1,f})), tag='P0';
  if(window.CompressionStream){ try{ const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')); bytes=new Uint8Array(await new Response(st).arrayBuffer()); tag='P1'; }catch(e){} }
  return `SIGNE-${tag}-${b64u(bytes)}`;
}
async function unpackCode(code){
  const mm=String(code).replace(/\s+/g,'').match(/^SIGNE-(P[01])-([A-Za-z0-9_-]+)$/);
  if(!mm) throw new Error('format');
  let bytes=unb64u(mm[2]);
  if(mm[1]==='P1'){ if(!window.DecompressionStream) throw new Error('navigateur'); const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); bytes=new Uint8Array(await new Response(st).arrayBuffer()); }
  const data=JSON.parse(new TextDecoder().decode(bytes)); if(!data||typeof data.f!=='object') throw new Error('contenu');
  return data.f;
}
const withState=(f,fn)=>{ const keep=S; S={f,tab:{}}; try{ return fn(); } finally { S=keep; } };
function vSave(v){
  const name=F('eleve_nom');
  v.innerHTML=`<div class="section-title" style="margin-top:0"><h2>Sauvegarder et reprendre mon travail</h2><span class="muted">${name?'Travail de '+esc(name):''}</span></div>
  <div class="note red" style="margin-bottom:16px">${I.warn}<p><b>Important :</b> tes réponses sont enregistrées dans le navigateur de cet ordinateur. <b>À la fin de chaque séance</b>, crée ton code de sauvegarde et garde-le (message sur l’ENT, document, e-mail à toi-même). Avec ce code, tu reprends ton travail sur n’importe quel ordinateur, et ton professeur peut consulter ton travail.</p></div>
  <div class="grid g2">
   <div class="card" style="display:grid;gap:12px;align-content:start"><h3 style="margin:0"><span class="ic">${I.copy}</span>1. Créer mon code</h3><p class="muted">Le code contient toutes tes réponses : annexes, défis, autoévaluations, entraînement.</p><button class="btn" id="mk">${I.spark} Créer mon code</button>
    <div id="mkout" hidden style="display:grid;gap:8px"><textarea id="codeout" rows="5" readonly aria-label="Mon code de sauvegarde" style="font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)"></textarea><div><button class="btn small" id="cpcode">${I.copy} Copier le code</button></div></div></div>
   <div class="card" style="display:grid;gap:12px;align-content:start"><h3 style="margin:0"><span class="ic">${I.folder}</span>2. Reprendre avec mon code</h3><p class="muted">Colle ici ton code. Il remplace les réponses enregistrées sur cet ordinateur.</p>
    <textarea id="codein" rows="5" placeholder="SIGNE-P1-…" aria-label="Coller mon code de sauvegarde" style="font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)"></textarea><div id="rsz"><button class="btn" id="restore">Reprendre mon travail ${I.arrow}</button></div></div>
  </div>
  <div class="card" style="margin-top:16px;display:grid;gap:10px"><h3 style="margin:0"><span class="ic">${I.people}</span>3. Nouvel élève sur cet ordinateur</h3><p class="muted">Ordinateur partagé ? Efface d’abord les réponses de l’élève précédent. ${name?`<b>Pense à créer le code de ${esc(name)} avant.</b>`:''}</p><div id="nwz"><button class="btn ghost" id="newst">Commencer comme nouvel élève</button></div></div>`;
  $('#mk',v).addEventListener('click',async()=>{ const c=await packState(); $('#codeout',v).value=c; $('#mkout',v).hidden=false; copyText(c,'Code copié : colle-le sur l’ENT ou dans ton document.'); });
  $('#cpcode',v).addEventListener('click',()=>{ const ta=$('#codeout',v); ta.select(); copyText(ta.value,'Code copié.'); });
  $('#restore',v).addEventListener('click',async()=>{
    let f; try{ f=await unpackCode($('#codein',v).value); }catch(e){ toast(e.message==='navigateur'?'Navigateur trop ancien : utilise Chrome, Edge, Firefox ou Safari récent.':'Ce code n’est pas valide : vérifie que tu l’as copié en entier.'); return; }
    const who=f.eleve_nom||'cet élève';
    $('#rsz',v).innerHTML=`<div class="confirm"><b>Reprendre le travail de ${esc(who)} ?</b><button class="btn small" id="rsyes">Oui, reprendre</button><button class="btn ghost small" id="rsno">Annuler</button></div>`;
    $('#rsno',v).addEventListener('click',()=>vSave(v));
    $('#rsyes',v).addEventListener('click',()=>{ S={f,tab:{}}; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} updateRing(); burst(); toast(`Travail de ${who} retrouvé.`); go('parcours'); });
  });
  $('#newst',v).addEventListener('click',()=>{ $('#nwz',v).innerHTML=`<div class="confirm"><b>Effacer les réponses de cet ordinateur ?</b><button class="btn small" id="nwy" style="background:var(--bad);box-shadow:none">Oui, nouvel élève</button><button class="btn ghost small" id="nwn">Annuler</button></div>`; $('#nwn',v).addEventListener('click',()=>vSave(v)); $('#nwy',v).addEventListener('click',()=>{ S={f:{},tab:{}}; try{ localStorage.removeItem(KEY); }catch(e){} updateRing(); toast('Page prête pour un nouvel élève.'); go('accueil'); }); });
}

/* ═══════════ BILAN ═══════════ */
function vBilan(v){

  v.innerHTML=`<div class="section-title" style="margin-top:0"><h2>Mon bilan</h2><span class="muted">${name?esc(name):''}${F('eleve_classe')?', '+esc(F('eleve_classe')):''}</span></div>

   <div class="kpi"><div class="v">${M.filter(m=>annexePct(m)>=100).length}</div><div class="muted">annexes complètes sur ${M.length}</div></div>
  </div>
  <div class="grid" style="margin-top:18px">${M.map(m=>{ const p=ETAPES[m.etape], q=quizState(m), mean=autoMean(m);
   return `<div class="card" style="border-left:6px solid ${p.c};display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;align-items:center"><button class="linkbtn" data-go="${m.id}" style="text-align:left;color:var(--ink)"><b>Mission ${m.n} : ${m.title}</b></button><span>Annexe ${m.annexe.n} : <b>${annexePct(m)} %</b></span><span>Défi : <b>${q.good}/${q.total}</b> ${q.done===q.total?stars(quizStars(m)):''}</span><span>${mean!==null?`<b style="color:${LVC[Math.round(mean)]}">${LV[Math.round(mean)]}</b>`:'<span class="muted">Autoévaluation à faire</span>'}</span></div>`; }).join('')}</div>
  <div class="grid g2" style="margin-top:18px">
   <div class="card" style="display:grid;gap:12px"><h3 style="margin:0"><span class="ic">${I.copy}</span>Rendre mon travail</h3><p class="muted">Copie toutes tes annexes et autoévaluations, puis colle-les dans ton document ou sur l’ENT.</p><div><button class="btn" id="copyAll">${I.copy} Copier tout mon travail</button></div></div>
   <div class="card" style="display:grid;gap:12px"><h3 style="margin:0"><span class="ic">${I.warn}</span>Recommencer à zéro</h3><p class="muted">Efface toutes tes réponses enregistrées sur cet appareil.</p><div id="resetz"><button class="btn ghost" id="reset">Tout effacer</button></div></div>
  </div>`;
  $('#copyAll',v).addEventListener('click',()=>copyText(allText(),'Tout ton travail est copié.'));
  $('#reset',v).addEventListener('click',()=>{ $('#resetz',v).innerHTML=`<div class="confirm"><b>Effacer toutes tes réponses ?</b><button class="btn small" id="rsy" style="background:var(--bad);box-shadow:none">Oui, tout effacer</button><button class="btn ghost small" id="rsn">Annuler</button></div>`; $('#rsn',v).addEventListener('click',()=>vBilan(v)); $('#rsy',v).addEventListener('click',()=>{ S={f:{},tab:{}}; try{ localStorage.removeItem(KEY); }catch(e){} toast('Toutes les réponses ont été effacées.'); go('accueil'); }); });
}

/* ═══════════ VISIONNEUSE DES RESSOURCES ═══════════ */
function openLB(m,idx){
  let i=idx; const list=m.res; const lb=document.createElement('div'); lb.className='lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true');
  const p=ETAPES[m.etape]; lb.style.setProperty('--c',p.c);
  const draw=()=>{ const r=list[i]; lb.innerHTML=`<div class="lb-bar">${list.length>1?`<button data-p aria-label="Ressource précédente">${I.back}</button>`:''}<b>${r.tag} : ${r.t}</b>${list.length>1?`<button data-n aria-label="Ressource suivante">${I.arrow}</button>`:''}<button data-x aria-label="Fermer">${I.x}<span>Fermer</span></button></div><div class="lb-body"><article class="doc">${r.html()}</article></div>`;
    $('[data-x]',lb).onclick=close; const pv=$('[data-p]',lb), nx=$('[data-n]',lb); if(pv) pv.onclick=()=>{ i=(i-1+list.length)%list.length; draw(); }; if(nx) nx.onclick=()=>{ i=(i+1)%list.length; draw(); }; $('[data-x]',lb).focus(); };
  const key=e=>{ if(e.key==='Escape') close(); if(e.key==='ArrowRight'){ i=(i+1)%list.length; draw(); } if(e.key==='ArrowLeft'){ i=(i-1+list.length)%list.length; draw(); } };
  const close=()=>{ lb.remove(); document.removeEventListener('keydown',key); document.body.style.overflow=''; };
  lb.addEventListener('click',e=>{ if(e.target===lb||e.target.classList.contains('lb-body')) close(); });
  document.addEventListener('keydown',key); document.body.style.overflow='hidden'; document.body.appendChild(lb); draw();
}
document.addEventListener('click',e=>{ const r=e.target.closest('[data-lbset]'); if(r){ openLB(M.find(m=>m.id===r.dataset.lbset),+r.dataset.i); } });

/* ═══════════ DÉMARRAGE ═══════════ */
route();
