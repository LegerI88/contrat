<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signé ! Mon premier contrat de travail – Terminale ASSP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat+Brush&family=Permanent+Marker&display=swap">
<style>
:root{
  --bg:#F1F8F7; --surface:#FFFFFF; --surface-2:#E3F2F0; --surface-3:#FFF8E6;
  --ink:#10242A; --muted:#55707A; --line:#CFE5E2;
  --main:#0E7C86; --main-ink:#FFFFFF; --main-soft:#D3EEEC;
  --e1:#7B4FD6; --e1-soft:#ECE4FB; --e2:#0E7C86; --e2-soft:#D3EEEC; --e3:#D9531F; --e3-soft:#FCE5DA;
  --gold:#F2AE10; --gold-soft:#FFF1CC;
  --lv0:#3A7FC2; --lv1:#2A9E63; --lv2:#8752C4; --lv3:#D99608;
  --ok:#1C9A5E; --ok-soft:#DDF6E9; --bad:#D23E3A; --bad-soft:#FDE3E1;
  --shadow:0 1px 2px rgba(10,60,70,.06),0 8px 24px rgba(10,60,70,.08);
  --f-mark:"Permanent Marker","Bricolage Grotesque",system-ui,sans-serif;
  --f-hand:"Caveat Brush","Bricolage Grotesque",cursive;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A1D; --surface:#14252A; --surface-2:#1B3237; --surface-3:#2A2617;
  --ink:#E8F4F2; --muted:#9DB8BE; --line:#2A444A;
  --main:#3CC4CC; --main-ink:#06191B; --main-soft:#16383B;
  --e1:#A887F0; --e1-soft:#2A2140; --e2:#3CC4CC; --e2-soft:#16383B; --e3:#FF8A5B; --e3-soft:#3E2216;
  --gold:#F7C443; --gold-soft:#3A2F12;
  --lv0:#6FAAE6; --lv1:#4CC98A; --lv2:#B08AE8; --lv3:#F2BC3C;
  --ok:#43C98A; --ok-soft:#133526; --bad:#FF6B63; --bad-soft:#3E1917;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1D; --surface:#14252A; --surface-2:#1B3237; --surface-3:#2A2617;
  --ink:#E8F4F2; --muted:#9DB8BE; --line:#2A444A;
  --main:#3CC4CC; --main-ink:#06191B; --main-soft:#16383B;
  --e1:#A887F0; --e1-soft:#2A2140; --e2:#3CC4CC; --e2-soft:#16383B; --e3:#FF8A5B; --e3-soft:#3E2216;
  --gold:#F7C443; --gold-soft:#3A2F12;
  --lv0:#6FAAE6; --lv1:#4CC98A; --lv2:#B08AE8; --lv3:#F2BC3C;
  --ok:#43C98A; --ok-soft:#133526; --bad:#FF6B63; --bad-soft:#3E1917;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--main)}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted)}
.hand{font-family:var(--f-hand)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.g2,.g3{grid-template-columns:1fr}}

/* barre du haut */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:6px;color:var(--ink);background:none;border:0;padding:4px 0;text-decoration:none}
.brand .mark{font-family:var(--f-mark);font-size:25px;line-height:1}
.brand svg{width:22px;height:22px;color:var(--main);margin-top:-8px}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:8px 12px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:14px;white-space:nowrap;color:var(--muted)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.ring{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-family:var(--f-display);font-weight:700}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--line)} .ring .fgc{stroke:var(--main);stroke-linecap:round;transition:stroke-dashoffset 1s}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:13px;font-family:var(--f-display);font-weight:700}
@media (max-width:640px){.top .wrap{gap:4px 12px;padding-block:6px}.nav{order:3;flex-basis:100%}.ring span{display:none}}

main{padding-block:28px 80px}
.view{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}

/* accueil */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(20px,4vw,56px);align-items:center;padding-block:10px 36px}
.hero > *{min-width:0}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--main-soft);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:13px}
.chip.dark{background:var(--ink);color:var(--bg)}
.wordmark{font-family:var(--f-mark);font-size:clamp(70px,12vw,140px);line-height:.9;display:flex;align-items:flex-end;position:relative;margin:0}
.wordmark span{display:inline-block;animation:letterIn .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes letterIn{from{transform:translateY(40px) rotate(-8deg) scale(.6);opacity:.001}to{transform:none;opacity:1}}
.wordmark .pen{width:.55em;color:var(--main);margin-left:.08em;margin-bottom:.1em;animation:penIn 1s .8s cubic-bezier(.3,1.7,.5,1) both}
@keyframes penIn{from{transform:translate(40px,-40px) rotate(40deg);opacity:.001}to{transform:rotate(-10deg);opacity:1}}
.tagline{display:inline-block;margin-top:14px;background:var(--main);color:var(--main-ink);font-family:var(--f-hand);font-size:clamp(24px,3.4vw,36px);padding:4px 18px 6px;transform:rotate(-2deg);border-radius:6px;box-shadow:4px 4px 0 var(--ink)}
.author{margin-top:18px;font-family:var(--f-display);font-size:16px;color:var(--muted)}
.author b{color:var(--ink)}
.hero-lede{margin-top:18px;font-size:18px;max-width:52ch}
.start{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px}
.start input{flex:1 1 220px;min-width:0;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.start input:focus{border-color:var(--main);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font-family:var(--f-display);font-weight:800;font-size:15.5px;background:var(--main);color:var(--main-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--main) 55%,#000);text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 color-mix(in srgb,var(--main) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--main) 55%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--main)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.btn svg{width:18px;height:18px}
.linkbtn{display:inline;padding:0;border:0;background:none;color:var(--main);font-weight:700;text-decoration:underline}
.photo{position:relative;justify-self:center;width:min(100%,500px)}
.photo .frame{background:var(--surface);padding:12px 12px 48px;border-radius:6px;box-shadow:var(--shadow),0 20px 50px rgba(10,60,70,.18);transform:rotate(2deg);animation:photoIn .9s .3s cubic-bezier(.2,1.2,.4,1) both;position:relative}
@keyframes photoIn{from{transform:rotate(12deg) translateY(40px) scale(.9);opacity:.001}to{transform:rotate(2deg);opacity:1}}
.photo .frame svg{display:block;width:100%;height:auto;border-radius:3px}
.photo .cap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--f-hand);font-size:24px;color:var(--ink)}
.tape{position:absolute;top:-14px;left:50%;width:120px;height:30px;background:color-mix(in srgb,var(--gold) 55%,transparent);transform:translateX(-50%) rotate(-3deg);border-radius:2px;z-index:2}
.sticker{position:absolute;background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:var(--f-display);font-weight:800;font-size:13px;box-shadow:3px 3px 0 var(--ink);z-index:3}
.sticker:nth-of-type(1){left:-14px;top:18%;transform:rotate(-8deg)}
.sticker:nth-of-type(2){right:-10px;top:8%;transform:rotate(6deg);background:var(--gold-soft)}
.sticker:nth-of-type(3){right:-16px;bottom:24%;transform:rotate(-4deg);background:var(--main-soft)}
.sticker:nth-of-type(4){left:4%;bottom:-12px;transform:rotate(4deg);background:var(--e3-soft)}
@media (max-width:860px){.sticker{display:none}}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.section-title h2{font-size:clamp(22px,2.8vw,30px)}
.path-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.path-strip{grid-template-columns:1fr}}
.pole-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.pole-card .num{display:inline-block;color:#fff;font-family:var(--f-display);font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px}
.pole-card h3{margin:10px 0 10px;font-size:19px}
.pole-card ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pole-card li button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:0;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.pole-card li button:hover{outline:2px solid var(--line)}
.mn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.4vw,22px);box-shadow:var(--shadow)}
.card h3{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ic{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--main-soft);color:var(--main)}
.ic svg{width:19px;height:19px}
ul.ticks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
ul.ticks li{position:relative;padding-left:24px}
ul.ticks li::before{content:"";position:absolute;left:3px;top:.45em;width:9px;height:9px;border-radius:3px;background:var(--main);transform:rotate(45deg)}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft);border-radius:var(--r);padding:14px 16px}
.note svg{flex:none;width:22px;height:22px;color:var(--gold)}
.note.blue{background:var(--main-soft)} .note.blue svg{color:var(--main)}
.note.red{background:var(--bad-soft)} .note.red svg{color:var(--bad)}

/* briefing */
.letter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,4vw,36px);position:relative;box-shadow:var(--shadow)}
.stamp{position:absolute;right:20px;top:18px;font-family:var(--f-hand);font-size:22px;color:var(--main);border:2px dashed var(--main);padding:2px 12px;border-radius:8px;transform:rotate(6deg)}
.letter h2{font-size:clamp(26px,3.4vw,38px);max-width:22ch;margin-top:8px}
.letter .lede{margin-top:14px;font-size:17.5px;max-width:68ch}
.problem{margin-top:26px;padding:20px 22px;border-radius:14px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.2vw,23px);line-height:1.35;position:relative}
.problem .q{position:absolute;top:-16px;left:18px;background:var(--main);color:var(--main-ink);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.caret{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.cast{grid-template-columns:repeat(2,minmax(0,1fr))}}
.person{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.person svg{width:84px;height:84px}
.person b{display:block;font-family:var(--f-display);font-size:16px;margin-top:6px}
.person span{font-size:14px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--line);display:grid;gap:14px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-26px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--main);border:3px solid var(--surface)}
.timeline b{display:block;font-family:var(--f-display)}
.timeline span{color:var(--muted);font-size:15px}

/* parcours */
.journey{display:grid;gap:18px}
.pole{border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:18px;box-shadow:var(--shadow);border-top:6px solid var(--c)}
.pole header{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pole header .num{background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px}
.mnode{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:12px 14px;margin-top:10px}
.mnode:hover{border-color:var(--c)}
.mnode .disc{position:relative;flex:none;width:66px;height:66px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--c)}
.mnode .disc svg{position:absolute;inset:0;width:66px;height:66px;transform:rotate(-90deg)}
.mnode .disc circle{fill:none;stroke-width:5}
.mnode b{font-family:var(--f-display);font-size:17px;display:block}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pill{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.go{background:var(--gold-soft);border-color:transparent}
.stars{display:inline-flex;gap:2px;color:var(--gold)}
.stars svg{width:18px;height:18px}
.stars .off{opacity:.25}

/* mission */
.mhead{border-radius:20px;padding:clamp(20px,3.5vw,34px);background:var(--c-soft);position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,3vw,30px);align-items:center}
.mhead > *{min-width:0}
.mhead .big{font-family:var(--f-display);font-weight:800;font-size:clamp(76px,12vw,140px);line-height:.8;color:var(--c);letter-spacing:-.04em}
.mhead h1{font-size:clamp(26px,3.6vw,42px);margin-top:6px}
.mhead .deco{position:absolute;right:-20px;bottom:-30px;width:180px;height:180px;color:var(--c);opacity:.12}
@media (max-width:600px){.mhead{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin:20px 0 22px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:14.5px;display:inline-flex;gap:8px;align-items:center}
.tabs button svg{width:17px;height:17px}
.tabs button:hover{border-color:var(--c)}
.tabs button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tabs .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tabs button[aria-selected="true"] .dot{background:#fff}
.panel{animation:viewIn .35s both}
.steps{display:grid;gap:10px}
.step{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.step ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.step .done{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.navm{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}

/* ressources */
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.res{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;display:grid;gap:6px;box-shadow:var(--shadow)}
.res:hover{border-color:var(--c)}
.res .th{position:relative;display:block;background:var(--surface-2);border-radius:10px;padding:14px;aspect-ratio:4/3}
.res .th svg{width:100%;height:100%}
.res small{font-family:var(--f-display);font-weight:800;color:var(--c)}
.res span.t{font-weight:700}
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,20,24,.72);display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-bar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.lb-bar b{flex:1;font-family:var(--f-display);min-width:0}
.lb-bar button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.lb-bar svg{width:18px;height:18px}
.lb-body{overflow:auto;padding:clamp(12px,3vw,30px)}
.doc{max-width:860px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:8px;padding:clamp(18px,3vw,34px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.doc h3{font-size:22px;margin-bottom:4px}
.doc h4{font-size:17px;margin:16px 0 6px}
.doc p,.doc li{margin-bottom:8px}
.doc .src{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:16px;padding-top:10px}
.doc .law{border-left:4px solid var(--c,var(--main));padding:6px 14px;margin:10px 0;background:var(--surface-2);border-radius:0 8px 8px 0}
.doc .law b{font-family:var(--f-display)}
.doc .contract{font-family:Georgia,"Times New Roman",serif;line-height:1.7}
.doc .contract h4{font-family:var(--f-body)}
.doc .portrait{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:start;margin:14px 0;padding:14px;border-radius:12px;background:var(--surface-2)}
.doc .portrait svg{width:90px;height:90px}
.doc .fake{font-size:13px;color:var(--muted);font-style:italic}
.pyr{display:grid;gap:6px;justify-items:center;margin:12px 0}
.pyr div{background:var(--c,var(--main));color:#fff;text-align:center;border-radius:8px;padding:8px 10px;font-family:var(--f-display);font-weight:700}

/* tableaux */
.tbl-wrap{overflow-x:auto}
table.form{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
table.form th{background:var(--surface-2);font-family:var(--f-display);text-align:left;padding:10px;font-size:14px}
table.form td{border-top:1px solid var(--line);padding:6px;vertical-align:top}
table.form td.rl{font-weight:700;padding:10px;white-space:nowrap}
table.form input,table.form textarea{width:100%;border:1px solid transparent;background:var(--bg);border-radius:8px;padding:8px;font:inherit;color:var(--ink);resize:vertical}
table.form input:focus,table.form textarea:focus{border-color:var(--c,var(--main));outline:none}
table.plain{border-collapse:collapse;width:100%;font-size:15px}
table.plain th,table.plain td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.plain th{background:var(--surface-2);font-family:var(--f-display)}

/* annexes */
.annexe{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.annexe > header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 22px;background:var(--c-soft)}
.annexe > header h2{font-size:24px}
.meter{display:flex;align-items:center;gap:10px}
.meter .bar{width:150px;height:10px;border-radius:999px;background:var(--surface);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--c);transition:width .6s}
.meter .pct{font-family:var(--f-display);font-weight:800}
.consigne{padding:14px 22px;border-bottom:1px solid var(--line)}
.blk{padding:18px 22px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.blk:last-child{border-bottom:0}
.blk > h3{font-size:18px;display:flex;align-items:center;gap:10px}
.bn{flex:none;width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px}
.hint{color:var(--muted);font-size:15px}
.fields{display:grid;gap:12px}
.fields.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.fields.c2{grid-template-columns:1fr}}
.fld{display:grid;gap:4px}
.fld > span{font-weight:700;font-size:15px}
.fld > em{font-style:normal;color:var(--muted);font-size:14px}
.fld input,.fld textarea,.fld select{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--c,var(--main));outline:none}
.fld input.filled,.fld textarea.filled{border-color:color-mix(in srgb,var(--c,var(--main)) 45%,var(--line))}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--bg);cursor:pointer}
.ck:has(input:checked){border-color:var(--c,var(--main));background:var(--c-soft,var(--main-soft))}
.calc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc label{font-weight:700;flex:1 1 260px}
.calc input{width:150px;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font:inherit;color:var(--ink)}
.calc .fb{font-weight:700;font-size:14.5px;min-width:120px}
.fb.ok{color:var(--ok)} .fb.ko{color:var(--bad)}
.corr{display:none;background:var(--gold-soft);border:2px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:15px}
.corr::before{content:"Corrigé professeur";display:block;font-family:var(--f-display);font-weight:800;margin-bottom:4px}
body.prof .corr{display:block}
.profbadge{display:none;position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--gold);color:#1a1a1a;font-family:var(--f-display);font-weight:800;padding:6px 12px;border-radius:999px;font-size:13px;border:0}
body.prof .profbadge{display:block}

/* défi */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px 20px}
.score .big{font-family:var(--f-display);font-weight:800;font-size:34px}
.score .stars{color:var(--gold)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;box-shadow:var(--shadow)}
.qcard .qn{font-family:var(--f-display);font-weight:800;color:var(--c,var(--main));font-size:14px}
.qcard h4{font-size:17px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px}
.opt:not(:disabled):hover{border-color:var(--c,var(--main))}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.exp{padding:10px 12px;border-left:4px solid var(--c,var(--main));background:var(--surface-2);border-radius:0 10px 10px 0;font-size:15px}
.sortrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg)}
.sortrow.good{border-color:var(--ok)} .sortrow.bad{border-color:var(--bad)}
.bins{display:flex;gap:6px;flex-wrap:wrap}
.bins button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700}
.bins button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.order-pool,.order-out{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:12px;border:2px dashed var(--line);min-height:52px}
.order-pool button,.order-out button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-weight:700;font-size:14.5px}
.order-out button{border-color:var(--c,var(--main))}

/* autoévaluation */
.lvl-legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
.lvl-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.crit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.crit h4 code{font-family:var(--f-display);background:var(--surface-2);padding:2px 8px;border-radius:6px;margin-right:8px}
.lvls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:760px){.lvls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lv{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;font-size:14px;display:grid;gap:4px}
.lv b{font-family:var(--f-display);color:var(--lc)}
.lv[aria-pressed="true"]{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 14%,var(--surface))}
.gauge{display:flex;gap:6px}
.gauge i{flex:1;height:14px;border-radius:999px;background:var(--line)}

/* ateliers */
.toggle-row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gaugebar{height:18px;border-radius:999px;background:linear-gradient(90deg,var(--ok),var(--gold),var(--bad));position:relative;margin:10px 0}
.gaugebar i{position:absolute;top:-5px;width:6px;height:28px;border-radius:3px;background:var(--ink);transition:left .5s cubic-bezier(.2,1.4,.4,1)}
.clause{display:block;width:100%;text-align:left;border:2px dashed transparent;background:transparent;border-radius:10px;padding:8px 10px;font-family:Georgia,"Times New Roman",serif;line-height:1.6}
.clause:hover{border-color:var(--line)}
.clause.flag-ok{border-color:var(--ok);border-style:solid;background:var(--ok-soft)}
.clause.flag-ko{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.tree{display:grid;gap:12px}
.tree .qbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.tree .res-final{background:var(--c-soft);border-radius:14px;padding:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:38px;color:var(--main)}
.out-line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:6px 0}
.out-line b{font-variant-numeric:tabular-nums}

/* lexique */
.lex-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lex-tools input{flex:1 1 220px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.cat-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.cat-tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.lexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lexcard{border:0;background:none;padding:0;perspective:900px;min-height:150px;text-align:left}
.lexcard .in{position:relative;display:block;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.lexcard[aria-pressed="true"] .in{transform:rotateY(180deg)}
.lexcard .f,.lexcard .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;display:grid;align-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.lexcard .f{border-top:6px solid var(--lxc)}
.lexcard .f b{font-family:var(--f-display);font-size:19px}
.lexcard .f small{color:var(--muted)}
.lexcard .cat{font-size:12.5px;font-weight:700;color:var(--lxc)}
.lexcard .b{transform:rotateY(180deg);font-size:14.5px;background:var(--surface-2)}

.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
footer.foot{border-top:1px solid var(--line);padding:22px 0 34px;color:var(--muted);font-size:14px}
footer.foot .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:150;transition:transform .3s;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</header>

<script>
"use strict";
/* ═══════════ RÉGLAGES ═══════════ */
const AUTEUR = 'Mme Isabelle LEGER';
const CODE_PROF = 'CONTRAT54';

/* ═══════════ ICÔNES ═══════════ */
const I = {

/* ═══════════ ÉTAT ═══════════ */

let S = {f:{}, tab:{}};

  ines:'<svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="40" fill="var(--gold-soft)"/><circle cx="42" cy="38" r="16" fill="#C68C6A"/><path d="M26 36C26 18 58 18 58 36C54 28 30 28 26 36Z" fill="#2B1B12"/><circle cx="58" cy="28" r="7" fill="#2B1B12"/><path d="M18 80C20 60 64 60 66 80Z" fill="var(--gold)"/></svg>',

function thumb(kind){
  const base = (inner)=>`<svg viewBox="0 0 160 120" aria-hidden="true"><rect x="28" y="8" width="104" height="104" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>${inner}</svg>`;

    portraits:`<circle cx="56" cy="40" r="12" fill="var(--e1)"/><circle cx="80" cy="40" r="12" fill="var(--gold)"/><circle cx="104" cy="40" r="12" fill="var(--e3)"/>${lines(70)}`,
    code:`<text x="80" y="48" text-anchor="middle" font-family="Georgia" font-weight="700" font-size="28" fill="var(--c,var(--main))">§</text>${lines(66)}`,
    tableau:`${[0,1,2,3].map(r=>[0,1,2].map(c=>`<rect x="${42+c*26}" y="${26+r*18}" width="24" height="16" fill="${r===0?'var(--c,var(--main))':'var(--surface-2)'}"/>`).join('')).join('')}`,
    note:`<rect x="40" y="20" width="80" height="14" rx="3" fill="var(--gold)"/>${lines(48)}${lines(80)}`,
    contrat:`<text x="80" y="36" text-anchor="middle" font-family="Arial" font-weight="700" font-size="9" fill="var(--ink)">CONTRAT</text>${lines(48)}<path d="M64 96q6-10 12 0t12 0" fill="none" stroke="var(--c,var(--main))" stroke-width="3"/>`,
    pyramide:`<path d="M80 22L122 98H38Z" fill="var(--c,var(--main))" opacity=".85"/><line x1="58" y1="60" x2="102" y2="60" stroke="#fff" stroke-width="2"/><line x1="48" y1="80" x2="112" y2="80" stroke="#fff" stroke-width="2"/>`,
    planning:`${[0,1,2,3,4].map(c=>`<rect x="${40+c*17}" y="26" width="14" height="${20+((c*29)%50)}" rx="3" fill="var(--c,var(--main))" opacity="${.4+c*.12}"/>`).join('')}`,
    paie:`<text x="80" y="34" text-anchor="middle" font-family="Arial" font-weight="700" font-size="9" fill="var(--ink)">BULLETIN</text>${lines(46)}<rect x="40" y="82" width="80" height="16" rx="3" fill="var(--c,var(--main))"/><text x="80" y="94" text-anchor="middle" font-family="Arial" font-weight="700" font-size="9" fill="#fff">NET</text>`,
    reglement:`<rect x="40" y="18" width="80" height="12" rx="3" fill="var(--e1)"/>${lines(42)}${lines(74)}`,

  }[kind] || lines(40);
  return base(k);
}

 res:[
  {id:'r1', tag:'Ressource 1', t:'Trois aides à domicile, trois statuts', th:'portraits', html:()=>`
   <h3>Trois aides à domicile, trois statuts</h3><p class="muted">Témoignages recueillis par Nadia Khelifi pour les stagiaires</p>
   <div class="portrait">${AV.ines}<div><b>Inès Durand, 24 ans, salariée de l’association Les Charmilles</b><p>« J’ai signé un CDI avec l’association. C’est Nadia qui fait mon planning et qui me dit chez qui je vais. Je reçois un bulletin de paie chaque mois et j’ai mes congés payés. Si je ne respecte pas le règlement intérieur, l’association peut me sanctionner. »</p></div></div>
   <div class="portrait">${AV.sandrine}<div><b>Sandrine Petit, 46 ans, salariée d’un particulier</b><p>« Je travaille 12 heures par semaine chez M. Roux, 81 ans. C’est lui mon employeur : il m’a embauchée directement et me paie avec le chèque emploi service universel (CESU). Il me dit ce que je dois faire chez lui et à quelle heure venir. »</p></div></div>
   <div class="portrait">${AV.karim}<div><b>Karim Belkacem, 33 ans, micro-entrepreneur</b><p>« Je suis immatriculé comme micro-entrepreneur. Je cherche mes clients, je fixe mes tarifs, j’achète mon matériel et je choisis mes horaires. Je facture mes prestations et je déclare mon chiffre d’affaires à l’Urssaf. Pas de congés payés : quand je ne travaille pas, je ne gagne rien. »</p></div></div>
   <p class="src">Document fictif créé pour ce scénario.</p>`},
  {id:'r2', tag:'Ressource 2', t:'Ce que dit le droit', th:'code', html:()=>`
   <h3>Contrat de travail ou contrat de prestation ?</h3>
   ${LAW('Code du travail, article L1221-1','Le contrat de travail est soumis aux règles du droit commun. Il peut être établi selon les formes que les parties contractantes décident d’adopter.')}
   <h4>Les trois éléments du contrat de travail</h4>
   <p>Le Code du travail ne définit pas le contrat de travail. Ce sont les juges qui ont dégagé ses trois éléments : une <b>prestation de travail</b>, une <b>rémunération</b> et un <b>lien de subordination</b>.</p>
   <h4>Le lien de subordination</h4>
   <p>Selon la Cour de cassation, le lien de subordination est caractérisé par l’exécution d’un travail sous l’autorité d’un employeur qui a le pouvoir de donner des ordres et des directives, d’en contrôler l’exécution et de sanctionner les manquements de son subordonné (Cass. soc., 13 novembre 1996, n° 94-13.187, arrêt « Société générale »).</p>
   <h4>Le travailleur indépendant</h4>
   <p>Une personne immatriculée (par exemple comme micro-entrepreneur) est présumée ne pas être salariée. Mais cette présomption peut tomber : si elle travaille dans un lien de subordination juridique permanente avec son donneur d’ordre, le juge peut reconnaître un contrat de travail (Code du travail, article L8221-6). On parle de <b>requalification</b>.</p>
   ${LAW('Code civil, article 1710','Le louage d’ouvrage est un contrat par lequel l’une des parties s’engage à faire quelque chose pour l’autre, moyennant un prix convenu entre elles.')}
   <p>Le contrat de prestation de services (ou contrat d’entreprise) relève donc du <b>droit civil</b>, et non du droit du travail.</p>
   <p class="src">Sources : ${LEGI} ; Code civil sur <a href="https://www.legifrance.gouv.fr/codes/id/LEGITEXT000006070721/" target="_blank" rel="noopener">Légifrance</a> ; Cour de cassation, chambre sociale, 13 novembre 1996.</p>`},
  {id:'r3', tag:'Ressource 3', t:'Salarié ou indépendant : ce qui change', th:'tableau', html:()=>`
   <h3>Salarié ou indépendant : ce qui change</h3>
   <div class="tbl-wrap"><table class="plain"><thead><tr><th></th><th>Salarié(e)</th><th>Indépendant(e)</th></tr></thead><tbody>
   <tr><th>Contrat signé</th><td>Contrat de travail avec un employeur</td><td>Contrat de prestation de services avec chaque client</td></tr>
   <tr><th>Droit applicable</th><td>Droit du travail (Code du travail, convention collective)</td><td>Droit civil et droit commercial</td></tr>
   <tr><th>Organisation du travail</th><td>Fixée par l’employeur</td><td>Choisie librement</td></tr>
   <tr><th>Revenu</th><td>Salaire au moins égal au SMIC ou au minimum de la convention collective</td><td>Chiffre d’affaires variable, prix fixés par l’indépendant</td></tr>
   <tr><th>Congés payés</th><td>2,5 jours ouvrables par mois de travail (art. L3141-3)</td><td>Pas de congés payés</td></tr>
   <tr><th>Perte d’activité</th><td>Assurance chômage des salariés, sous conditions</td><td>Pas d’assurance chômage des salariés (une allocation spécifique aux indépendants existe, sous conditions strictes)</td></tr>
   <tr><th>Cotisations sociales</th><td>Partagées entre l’employeur et le salarié, prélevées sur le bulletin de paie</td><td>Payées par l’indépendant lui-même</td></tr>
   <tr><th>Fin de la relation</th><td>Règles du Code du travail (démission, licenciement…)</td><td>Règles prévues dans le contrat de prestation</td></tr>
   </tbody></table></div>
   <p class="src">Synthèse réalisée pour le scénario à partir du Code du travail. Pour aller plus loin : <a href="https://entreprendre.service-public.fr" target="_blank" rel="noopener">entreprendre.service-public.fr</a>.</p>`}
 ],
 cours:`<h3>Le contrat de travail</h3>
  <p>Le contrat de travail est la convention par laquelle une personne (le salarié) s’engage à travailler <b>pour le compte et sous la direction</b> d’une autre (l’employeur), en échange d’une rémunération.</p>
  <div class="grid g3" style="margin:14px 0">
   <div class="card"><h3><span class="ic">${I.brief}</span>Prestation de travail</h3><p>Le salarié effectue un travail : aide au lever, entretien, accompagnement…</p></div>
   <div class="card"><h3><span class="ic">${I.heart}</span>Rémunération</h3><p>L’employeur verse un salaire en contrepartie.</p></div>
   <div class="card"><h3><span class="ic">${I.scale}</span>Lien de subordination</h3><p>L’employeur donne des ordres, contrôle et peut sanctionner.</p></div>
  </div>
  <h3>Le travailleur indépendant</h3>
  <p>Il travaille pour son propre compte. Il signe avec ses clients un <b>contrat de prestation de services</b> (contrat d’entreprise), régi par le droit civil. Il est libre d’organiser son travail mais il supporte seul les risques.</p>
  <h3>La requalification</h3>
  <p>Le nom donné au contrat ne compte pas : seule compte la réalité. Si un « indépendant » travaille en fait sous l’autorité permanente d’un donneur d’ordre, le juge peut requalifier la relation en contrat de travail (art. L8221-6 du Code du travail).</p>
  <h3>Dans le secteur des services à la personne</h3>
  <p>On peut être salarié d’une structure (association, entreprise, CCAS…), salarié d’un particulier employeur (souvent payé en CESU) ou indépendant. Le métier est le même, les droits sont très différents.</p>`,

 criteres:['Le contrat choisi est adapté à chaque besoin.','Le motif légal et l’article sont cités.','L’interdiction de pourvoir un emploi permanent par un CDD est expliquée.'],
 conseil:'Pose-toi toujours la même question : ce besoin est-il permanent ou temporaire ? Si c’est permanent, c’est un CDI.',
 res:[
  {id:'r4', tag:'Ressource 4', t:'La note de Nadia : les besoins de l’année', th:'note', html:()=>`
   <h3>Note interne : besoins en personnel</h3><p class="muted">De Nadia Khelifi à la direction, copie au stagiaire</p>
   <p><b>Besoin A.</b> L’association ouvre un nouveau secteur sur quatre communes rurales. Il faut une aide à domicile de plus, 28 heures par semaine, pour longtemps.</p>
   <p><b>Besoin B.</b> Inès part en congé de maternité de mars à juillet. Il faut la remplacer.</p>
   <p><b>Besoin C.</b> En juillet et août, beaucoup de familles partent en vacances et les sorties d’hôpital augmentent : la demande de passages augmente pendant deux mois.</p>
   <p><b>Besoin D.</b> Samedi et dimanche prochains, une intervenante est malade et aucune salariée n’est disponible. Il faut quelqu’un tout de suite, pour deux jours.</p>
   <p><b>Remarque de Mme Vasseur, directrice :</b> « Pour le besoin A, faisons plutôt des CDD de six mois qu’on renouvelle, comme ça on garde la personne seulement si elle nous convient. »</p>
   <p class="src">Document fictif créé pour ce scénario.</p>`},
  {id:'r5', tag:'Ressource 5', t:'Le Code du travail : CDI et CDD', th:'code', html:()=>`
   <h3>Extraits du Code du travail</h3>
   ${LAW('Article L1221-2 (alinéa 1)','Le contrat de travail à durée indéterminée est la forme normale et générale de la relation de travail.')}
   ${LAW('Article L1242-1','Un contrat de travail à durée déterminée, quel que soit son motif, ne peut avoir ni pour objet ni pour effet de pourvoir durablement un emploi lié à l’activité normale et permanente de l’entreprise.')}
   <div class="law"><b>Article L1242-2 (extrait, résumé)</b><br>Un CDD ne peut être conclu que pour l’exécution d’une tâche précise et temporaire, et seulement dans certains cas, notamment : le <b>remplacement d’un salarié absent</b> ; l’<b>accroissement temporaire de l’activité</b> de l’entreprise ; les emplois saisonniers.</div>
   ${LAW('Article L1242-12 (alinéa 1)','Le contrat de travail à durée déterminée est établi par écrit et comporte la définition précise de son motif. A défaut, il est réputé conclu pour une durée indéterminée.')}
   <div class="law"><b>Autres règles à connaître (résumé)</b><br>Le CDD précise notamment : le nom et la qualification du salarié remplacé (en cas de remplacement), la date du terme ou la durée minimale, le poste, la convention collective applicable, la durée de la période d’essai, la rémunération (art. L1242-12).<br>La période d’essai d’un CDD ne peut dépasser un jour par semaine de contrat, dans la limite de deux semaines si le contrat dure au plus six mois, et d’un mois au-delà (art. L1242-10).<br>À la fin d’un CDD, le salarié perçoit en principe une indemnité de fin de contrat égale à 10 % de la rémunération totale brute perçue (art. L1243-8).<br>En règle générale, un CDD ne peut dépasser 18 mois, renouvellements compris (art. L1242-8-1).</div>
   <p class="src">Source : ${LEGI}.</p>`},
  {id:'r6', tag:'Ressource 6', t:'L’intérim : une relation à trois', th:'tableau', html:()=>`
   <h3>Le travail temporaire (intérim)</h3>
   <svg viewBox="0 0 520 220" role="img" aria-label="Schéma : l’entreprise de travail temporaire signe un contrat de mise à disposition avec l’entreprise utilisatrice et un contrat de mission avec le salarié intérimaire, qui travaille chez l’entreprise utilisatrice" style="width:100%;max-width:560px;display:block;margin:10px auto">
    <rect x="180" y="10" width="160" height="56" rx="12" fill="var(--e1-soft)" stroke="var(--e1)" stroke-width="2"/><text x="260" y="34" text-anchor="middle" font-family="Arial" font-weight="700" font-size="13" fill="var(--ink)">Entreprise de travail</text><text x="260" y="52" text-anchor="middle" font-family="Arial" font-weight="700" font-size="13" fill="var(--ink)">temporaire (agence)</text>
    <rect x="10" y="150" width="170" height="56" rx="12" fill="var(--main-soft)" stroke="var(--main)" stroke-width="2"/><text x="95" y="174" text-anchor="middle" font-family="Arial" font-weight="700" font-size="13" fill="var(--ink)">Entreprise utilisatrice</text><text x="95" y="192" text-anchor="middle" font-family="Arial" font-size="12" fill="var(--ink)">(l’association)</text>
    <rect x="340" y="150" width="170" height="56" rx="12" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/><text x="425" y="174" text-anchor="middle" font-family="Arial" font-weight="700" font-size="13" fill="var(--ink)">Salarié intérimaire</text><text x="425" y="192" text-anchor="middle" font-family="Arial" font-size="12" fill="var(--ink)">(l’aide à domicile)</text>
    <line x1="200" y1="66" x2="110" y2="150" stroke="var(--ink)" stroke-width="2"/><text x="100" y="104" font-family="Arial" font-size="12" fill="var(--ink)">contrat de mise</text><text x="100" y="118" font-family="Arial" font-size="12" fill="var(--ink)">à disposition</text>
    <line x1="320" y1="66" x2="410" y2="150" stroke="var(--ink)" stroke-width="2"/><text x="372" y="104" font-family="Arial" font-size="12" fill="var(--ink)">contrat de mission</text><text x="372" y="118" font-family="Arial" font-size="12" fill="var(--ink)">(contrat de travail)</text>
    <line x1="180" y1="178" x2="340" y2="178" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/><text x="260" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="var(--ink)">travaille sous les consignes de</text>
   </svg>
   <p>L’agence d’intérim est l’<b>employeur</b> : elle rémunère le salarié intérimaire. L’association, elle, organise son travail sur place (art. L1251-1). On ne peut recourir à l’intérim que pour une tâche précise et temporaire, par exemple le remplacement d’un salarié absent ou un accroissement temporaire d’activité (art. L1251-6).</p>
   <p class="src">Source : ${LEGI}.</p>`}
 ],
 cours:`<h3>Le CDI, la règle</h3>
  <p>Le contrat à durée indéterminée est « la forme normale et générale de la relation de travail » (art. L1221-2). Il n’a pas de date de fin. Il peut commencer par une période d’essai.</p>
  <h3>Le CDD, l’exception</h3>
  <p>Le CDD n’est possible que pour une tâche précise et temporaire, dans les cas prévus par la loi : remplacement d’un salarié absent, accroissement temporaire d’activité, emploi saisonnier… Il ne doit jamais servir à pourvoir durablement un emploi permanent (art. L1242-1).</p>
  <p>Il doit être écrit et indiquer son motif précis. Sans écrit ou sans motif, il est réputé conclu à durée indéterminée (art. L1242-12). À la fin, le salarié perçoit en principe une indemnité de fin de contrat de 10 % (art. L1243-8).</p>
  <h3>Le contrat de travail temporaire (intérim)</h3>
  <p>C’est une relation à trois : l’agence (employeur), l’entreprise utilisatrice et le salarié intérimaire. Les motifs autorisés sont proches de ceux du CDD.</p>
  <div class="tbl-wrap"><table class="plain"><thead><tr><th></th><th>CDI</th><th>CDD</th><th>Intérim</th></tr></thead><tbody>
   <tr><th>Durée</th><td>Indéterminée</td><td>Limitée (en général 18 mois maximum)</td><td>Limitée</td></tr>
   <tr><th>Employeur</th><td>L’entreprise</td><td>L’entreprise</td><td>L’agence d’intérim</td></tr>
   <tr><th>Motif à justifier</th><td>Non</td><td>Oui, écrit dans le contrat</td><td>Oui</td></tr>
  </tbody></table></div>`,

 productions:['L’Annexe 3, « Fiche d’analyse de mon contrat » : identité du contrat, sources du droit, obligations, clauses illégales et cas pratique du cadeau.'],
 criteres:['Les informations du contrat sont relevées sans erreur.','Les obligations sont classées et justifiées.','Les deux clauses illégales sont repérées et expliquées.'],
 conseil:'Un contrat ne peut pas retirer à un salarié les droits que la loi lui garantit. Quand une clause te semble bizarre, cherche ce que dit le Code du travail.',
 res:[
  {id:'r7', tag:'Ressource 7', t:'Mon projet de contrat de travail (CDI)', th:'contrat', html:()=>`
   <div class="contract"><h3 style="font-family:var(--f-display)">Contrat de travail à durée indéterminée à temps partiel</h3>
   <p><b>Entre</b> l’association Les Charmilles, 12 rue des Tisserands à Bellerive, service autonomie à domicile, représentée par Mme Claire Vasseur, directrice, ci-après « l’employeur »,</p>
   <p><b>Et</b> ${nom()}, titulaire du baccalauréat professionnel ASSP, ci-après « le salarié ».</p>
   <h4>Article 1 : Engagement</h4><p>Le salarié est engagé à compter du jeudi 1er juillet 2027, pour une durée indéterminée, en qualité d’aide à domicile, classé selon la grille de la convention collective.</p>
   <h4>Article 2 : Convention collective</h4><p>Le contrat est régi par la convention collective nationale de la branche de l’aide, de l’accompagnement, des soins et des services à domicile du 21 mai 2010 (IDCC 2941) et par le règlement intérieur de l’association.</p>
   <h4>Article 3 : Période d’essai</h4><p>Le contrat ne deviendra définitif qu’à l’issue d’une période d’essai de deux mois.</p>
   <h4>Article 4 : Durée du travail</h4><p>Le salarié travaille 28 heures par semaine, soit 121,33 heures par mois. Les horaires sont communiqués par un planning remis au moins sept jours à l’avance. Des heures complémentaires pourront être demandées dans les limites légales.</p>
   <h4>Article 5 : Rémunération</h4><p>Le salarié percevra un taux horaire brut de 13,10 € (montant fictif), soit un salaire mensuel brut de base de 121,33 h × 13,10 €.</p>
   <h4>Article 6 : Fonctions</h4><p>Aide au lever, au coucher, à l’habillage et à la toilette (hors soins infirmiers), aide à la prise des repas, entretien du logement, accompagnement aux courses et aux sorties.</p>
   <h4>Article 7 : Obligations du salarié</h4><p>Le salarié s’engage à respecter le planning, les consignes de sa responsable de secteur et le règlement intérieur, et à garder la plus grande discrétion sur les informations concernant les personnes accompagnées.</p>
   <h4>Article 8 : Congés payés</h4><p>Le salarié renonce à ses congés payés pendant la première année afin d’assurer la continuité du service.</p>
   <h4>Article 9 : Engagement personnel</h4><p>Le salarié s’engage à n’adhérer à aucun syndicat pendant toute la durée du contrat.</p>
   <p>Fait à Bellerive, le … juin 2027, en deux exemplaires.</p></div>
   <p class="src">Document fictif créé pour ce scénario. Le taux horaire est fictif : compare-le avec le SMIC en vigueur le jour où tu fais l’exercice.</p>`},
  {id:'r8', tag:'Ressource 8', t:'Les sources du droit du travail', th:'pyramide', html:()=>`
   <h3>D’où viennent les règles qui s’appliquent à mon travail ?</h3>
   <div class="pyr">
    <div style="width:46%">Code du travail (lois et règlements)</div>
    <div style="width:62%">Convention collective de branche</div>
    <div style="width:76%">Accord d’entreprise</div>
    <div style="width:88%">Règlement intérieur</div>
    <div style="width:100%">Contrat de travail</div>
   </div>
   <p>Au-dessus du Code du travail se trouvent aussi la Constitution et les textes européens et internationaux.</p>
   <h4>La règle de base</h4><p>Une source inférieure ne peut pas retirer au salarié des droits accordés par une source supérieure d’ordre public. Elle peut en revanche lui accorder des droits plus favorables : c’est l’idée du <b>principe de faveur</b>.</p>
   <h4>Une nuance depuis 2017</h4><p>Depuis les ordonnances de 2017, un accord d’entreprise peut, dans de nombreux domaines, prévoir des règles différentes de la convention de branche. Mais il existe des thèmes pour lesquels l’accord d’entreprise ne peut pas déroger à la convention collective (le ministère du Travail en recense 13, plus 4 que la branche peut « verrouiller »).</p>
   <h4>Ma convention collective</h4><p>Pour l’aide à domicile associative, c’est la convention collective de la branche de l’aide, de l’accompagnement, des soins et des services à domicile (IDCC 2941). Elle classe les emplois et fixe notamment les rémunérations minimales de la branche. Elle reconnaît des diplômes de la filière ASSP parmi les diplômes de référence de sa classification.</p>
   <p class="src">Sources : ${LEGI} ; Ministère du Travail, fiche de la convention collective 2941 sur <a href="https://code.travail.gouv.fr/convention-collective/2941" target="_blank" rel="noopener">code.travail.gouv.fr</a> ; texte de la convention sur <a href="https://www.legifrance.gouv.fr/conv_coll/id/KALIARTI000044159641" target="_blank" rel="noopener">Légifrance</a>.</p>`},
  {id:'r9', tag:'Ressource 9', t:'Les obligations de l’employeur et du salarié', th:'code', html:()=>`
   <h3>Qui doit quoi ?</h3>
   ${LAW('Article L1222-1','Le contrat de travail est exécuté de bonne foi.')}
   <h4>L’employeur doit notamment</h4>
   <ul><li>fournir le travail convenu et payer le salaire ;</li><li>respecter la loi, la convention collective et le contrat ;</li><li>assurer la sécurité et protéger la santé physique et mentale des salariés (art. L4121-1) ;</li><li>assurer l’adaptation des salariés à leur poste de travail et veiller à leur capacité à occuper un emploi, notamment par la formation (art. L6321-1).</li></ul>
   <h4>Le salarié doit notamment</h4>
   <ul><li>exécuter personnellement le travail demandé, en respectant les consignes ;</li><li>respecter le règlement intérieur et les horaires ;</li><li>être loyal envers son employeur et discret sur ce qu’il apprend dans son travail.</li></ul>
   <h4>Les libertés du salarié</h4>
   ${LAW('Article L1121-1','Nul ne peut apporter aux droits des personnes et aux libertés individuelles et collectives de restrictions qui ne seraient pas justifiées par la nature de la tâche à accomplir ni proportionnées au but recherché.')}
   <p>Le Code du travail interdit aussi toute discrimination liée aux activités syndicales (art. L1132-1). Et les congés payés sont un droit : 2,5 jours ouvrables par mois de travail (art. L3141-3).</p>
   <p class="src">Source : ${LEGI}.</p>`},
  {id:'r10', tag:'Ressource 10', t:'Extrait du règlement intérieur', th:'reglement', html:()=>`
   <h3>Règlement intérieur de l’association Les Charmilles (extraits)</h3>
   <p><b>Article 4. Ponctualité.</b> Tout retard ou absence doit être signalé immédiatement par téléphone à la responsable de secteur.</p>
   <p><b>Article 7. Cadeaux et argent.</b> Il est interdit d’accepter de l’argent, des cadeaux de valeur ou des procurations bancaires de la part des personnes accompagnées ou de leur famille.</p>
   <p><b>Article 8. Clés.</b> Les clés confiées par les bénéficiaires sont rangées dans la boîte sécurisée prévue à cet effet.</p>
   <p><b>Article 10. Téléphone.</b> L’usage du téléphone personnel est limité aux urgences pendant les interventions.</p>
   <p><b>Article 15. Sanctions.</b> Selon leur gravité, les manquements peuvent entraîner un avertissement, une mise à pied ou un licenciement.</p>
   <p class="src">Document fictif créé pour ce scénario. Le règlement intérieur est obligatoire dans les entreprises et associations d’au moins 50 salariés (art. L1311-2 du Code du travail).</p>`}
 ],
 cours:`<h3>Ce que contient un contrat de travail</h3>
  <p>L’identité des parties, la date d’embauche, l’emploi et la qualification, la durée du travail, la rémunération, la convention collective applicable, éventuellement une période d’essai. Pour un CDI, la période d’essai est au maximum de 2 mois pour un ouvrier ou un employé (art. L1221-19), renouvelable une fois seulement si un accord de branche étendu le prévoit.</p>
  <h3>La hiérarchie des sources du droit du travail</h3>
  <p>Code du travail, convention collective, accord d’entreprise, règlement intérieur, contrat de travail. Une règle inférieure ne peut pas retirer au salarié les droits garantis par une règle supérieure d’ordre public, mais elle peut être plus favorable. Une clause contraire à la loi est sans effet.</p>
  <h3>Des obligations réciproques</h3>
  <div class="tbl-wrap"><table class="plain"><thead><tr><th>L’employeur</th><th>Le salarié</th></tr></thead><tbody>
   <tr><td>Fournir le travail et payer le salaire</td><td>Exécuter personnellement le travail</td></tr>
   <tr><td>Assurer la sécurité et la santé (art. L4121-1)</td><td>Respecter les consignes et le règlement intérieur</td></tr>
   <tr><td>Adapter le salarié à son poste, le former (art. L6321-1)</td><td>Être loyal et discret</td></tr>
   <tr><td>Respecter les libertés du salarié (art. L1121-1)</td><td>Respecter les horaires</td></tr>
  </tbody></table></div>
  <h3>Le pouvoir de l’employeur</h3>
  <p>L’employeur a un pouvoir de direction (il organise le travail) et un pouvoir disciplinaire (il peut sanctionner une faute, en respectant une procédure). C’est l’expression concrète du lien de subordination.</p>`,

  {t:'fields', title:'Identité du contrat', cols:2, items:[{k:'a3_type',l:'Type de contrat',r:1},{k:'a3_emp',l:'Employeur',r:1},{k:'a3_date',l:'Date d’embauche',r:1},{k:'a3_poste',l:'Emploi',r:1},{k:'a3_duree',l:'Durée du travail',r:1},{k:'a3_essai',l:'Période d’essai (conforme ? pourquoi ?)',r:2},{k:'a3_remu',l:'Rémunération',r:1},{k:'a3_cc',l:'Convention collective applicable',r:1}],

  {t:'fields', title:'Le taux horaire respecte-t-il la loi ?', hint:'Cherche le SMIC horaire brut en vigueur sur service-public.fr. Note la valeur, la date et la source.', items:[{k:'a3_smic',l:'SMIC horaire brut en vigueur (valeur, date, source)',r:2},{k:'a3_smic2',l:'Ma conclusion',r:2}],
   corr:'Au 1er octobre 2026, le SMIC horaire brut est de 12,31 € depuis le 1er juin 2026 (source : info.gouv.fr, « Le SMIC revalorisé le 1er juin 2026 »). 13,10 € est supérieur au SMIC : la clause est conforme sur ce point, sous réserve du minimum de la convention collective. Le SMIC étant revalorisé au moins chaque 1er janvier, revérifier la valeur le jour de la séance. Si le SMIC horaire brut devenait supérieur à 13,10 €, la clause de rémunération serait illégale : l’employeur doit verser au moins le SMIC, et au moins le minimum prévu par la convention collective si celui-ci est plus élevé.'},
  {t:'table', title:'Les obligations de chacun', k:'a3_ob', cols:['','Une obligation','Où est-elle écrite ? (contrat, règlement, Code du travail…)'], rowLabels:['Employeur 1','Employeur 2','Salarié 1','Salarié 2'],

 res:[
  {id:'r11', tag:'Ressource 11', t:'Repères sur la durée du travail', th:'code', html:()=>`
   <h3>La durée du travail : les repères</h3>
   <div class="tbl-wrap"><table class="plain"><tbody>
    <tr><th>Durée légale</th><td>35 heures par semaine (art. L3121-27)</td></tr>
    <tr><th>Durée maximale par jour</th><td>10 heures, sauf exceptions (art. L3121-18)</td></tr>
    <tr><th>Durée maximale par semaine</th><td>48 heures (art. L3121-20)</td></tr>
    <tr><th>Repos quotidien</th><td>Au moins 11 heures consécutives (art. L3131-1)</td></tr>
    <tr><th>Temps partiel</th><td>Durée inférieure à la durée légale (art. L3123-1)</td></tr>
    <tr><th>Heures complémentaires</th><td>Heures faites par un salarié à temps partiel au-delà de la durée prévue au contrat. Elles sont limitées en principe au dixième de cette durée (art. L3123-28) et chacune est majorée de 10 % dans cette limite (art. L3123-29).</td></tr>
    <tr><th>Heures supplémentaires</th><td>Heures faites au-delà de 35 heures par semaine. À défaut d’accord, majoration de 25 % pour les 8 premières, puis 50 % (art. L3121-36).</td></tr>
    <tr><th>Congés payés</th><td>2,5 jours ouvrables par mois de travail, soit 30 jours ouvrables (5 semaines) par an (art. L3141-3).</td></tr>
   </tbody></table></div>
   <p class="src">Source : ${LEGI}. Une convention ou un accord collectif peut prévoir certaines règles différentes, dans les limites fixées par la loi.</p>`},
  {id:'r12', tag:'Ressource 12', t:'Mon planning de la semaine 38', th:'planning', html:()=>`
   <h3>Planning de ${nom()} : semaine 38</h3>
   <div class="tbl-wrap"><table class="plain"><thead><tr><th>Jour</th><th>Interventions</th><th>Heures</th></tr></thead><tbody>
    <tr><td>Lundi</td><td>8 h – 12 h : Mme Marchal, M. Roux</td><td>4 h</td></tr>
    <tr><td>Mardi</td><td>8 h – 12 h, 14 h – 17 h : quatre bénéficiaires</td><td>7 h</td></tr>
    <tr><td>Mercredi</td><td>8 h – 12 h, puis 19 h – 21 h : aide au coucher</td><td>6 h</td></tr>
    <tr><td>Jeudi</td><td>7 h – 12 h, 13 h – 19 h : remplacements</td><td>11 h</td></tr>
    <tr><td>Vendredi</td><td>Repos</td><td>0 h</td></tr>
    <tr><th colspan="2">Total</th><th>28 h</th></tr>
   </tbody></table></div>
   <p class="src">Document fictif créé pour ce scénario. Les temps de trajet ne sont pas indiqués pour simplifier.</p>`},
  {id:'r13', tag:'Ressource 13', t:'Mon bulletin de paie de septembre (à compléter)', th:'paie', html:()=>`
   <h3>Bulletin de paie simplifié : septembre 2027</h3>

  {id:'r14', tag:'Ressource 14', t:'Les représentants du personnel : le CSE', th:'reglement', html:()=>`
   <h3>Le comité social et économique (CSE)</h3>
   <p>Un CSE doit être mis en place dans les entreprises et associations d’au moins 11 salariés (art. L2311-2 du Code du travail). Ses membres sont élus par les salariés.</p>
   <p>Dans les structures de 11 à 49 salariés, la délégation du personnel au CSE a notamment pour mission de présenter à l’employeur les réclamations individuelles ou collectives relatives aux salaires et à l’application du Code du travail (art. L2312-5). Ses membres peuvent aussi saisir l’inspection du travail.</p>
   <p><b>Aux Charmilles</b> (48 salariés), deux élues du CSE tiennent une permanence le premier lundi de chaque mois.</p>
   <p class="src">Source : ${LEGI}. Les informations sur l’association sont fictives.</p>`}
 ],
 cours:`<h3>La durée du travail</h3>
  <p>La durée légale est de 35 heures par semaine. Ce n’est pas un maximum : c’est le seuil au-delà duquel les heures sont des heures supplémentaires. Les maximums sont de 10 heures par jour et 48 heures par semaine, et le repos quotidien est d’au moins 11 heures consécutives.</p>
  <h3>Temps partiel : les heures complémentaires</h3>
  <p>Beaucoup d’aides à domicile travaillent à temps partiel. Les heures faites au-delà de la durée du contrat sont des <b>heures complémentaires</b>, limitées en principe au dixième de la durée prévue et majorées de 10 % dans cette limite.</p>
  <h3>Lire un bulletin de paie</h3>
  <p><b>Salaire brut</b> = salaire de base + heures complémentaires ou supplémentaires + primes. <b>Net avant impôt</b> = brut − cotisations salariales. Puis l’impôt prélevé à la source est retiré pour obtenir le net payé.</p>
  <h3>Les congés payés</h3>
  <p>2,5 jours ouvrables par mois de travail, soit 30 jours ouvrables par an. Les jours ouvrables sont tous les jours de la semaine sauf le jour de repos hebdomadaire (en général le dimanche) et les jours fériés chômés.</p>
  <h3>Les représentants du personnel</h3>
  <p>À partir de 11 salariés, le CSE porte les réclamations des salariés auprès de l’employeur. En cas de litige non résolu, le salarié peut aussi contacter l’inspection du travail, puis saisir le conseil de prud’hommes.</p>`,

 res:[
  {id:'r15', tag:'Ressource 15', t:'Cinq fins de contrat chez Les Charmilles', th:'porte', html:()=>`
   <h3>Cinq situations à traiter</h3>
   <p><b>Situation 1 : toi.</b> En CDI depuis deux ans, tu as été admis(e) dans un institut de formation d’aide-soignant pour septembre. Tu veux quitter l’association.</p>
   <p><b>Situation 2 : Lucas.</b> Il a été embauché en CDD pour remplacer une salariée en arrêt maladie jusqu’en décembre. En octobre, un EHPAD lui propose un CDI. Il veut partir.</p>
   <p><b>Situation 3 : Jordan.</b> Salarié en CDI, il a pris 80 € dans le porte-monnaie d’une bénéficiaire. Les faits sont prouvés. La directrice veut se séparer de lui.</p>
   <p><b>Situation 4 : Inès.</b> En CDI, elle souhaite déménager pour suivre son conjoint. L’association et elle sont d’accord pour mettre fin au contrat, en négociant une indemnité.</p>
   <p><b>Situation 5 : Karim.</b> Micro-entrepreneur, il intervenait chez Mme Leroy grâce à un contrat de prestation. Mme Leroy entre en EHPAD et met fin au contrat en respectant le préavis prévu.</p>
   <p class="src">Situations fictives créées pour ce scénario.</p>`},
  {id:'r16', tag:'Ressource 16', t:'Les modes de rupture', th:'code', html:()=>`
   <h3>Les modes de rupture du contrat de travail</h3>
   <div class="tbl-wrap"><table class="plain"><thead><tr><th>Mode</th><th>À l’initiative de</th><th>Règles principales</th></tr></thead><tbody>
    <tr><td><b>Démission</b> (CDI)</td><td>Salarié</td><td>Volonté claire et non équivoque de quitter l’entreprise. Pas de motif à donner. Préavis fixé par la loi, la convention collective ou les usages. Pas d’indemnité de rupture ; en principe pas d’allocation chômage (sauf cas de démission reconnue comme légitime ou projet de reconversion validé).</td></tr>
    <tr><td><b>Licenciement</b> (CDI)</td><td>Employeur</td><td>Il faut une cause réelle et sérieuse (motif personnel ou économique) et respecter une procédure : convocation à un entretien préalable (art. L1232-2), lettre de licenciement motivée. En cas de faute grave : pas de préavis ni d’indemnité de licenciement.</td></tr>
    <tr><td><b>Rupture conventionnelle</b> (CDI)</td><td>Les deux</td><td>Accord commun signé dans une convention (art. L1237-11). Chacun dispose de 15 jours calendaires pour se rétracter (art. L1237-13), puis l’administration homologue la convention (art. L1237-14). Indemnité au moins égale à l’indemnité légale de licenciement. Ouvre droit à l’assurance chômage sous conditions.</td></tr>
    <tr><td><b>Fin de CDD</b></td><td>—</td><td>Le CDD s’arrête à son terme. Rupture anticipée possible seulement dans certains cas : accord des parties, faute grave, force majeure, inaptitude constatée par le médecin du travail (art. L1243-1), ou embauche du salarié en CDI (art. L1243-2, avec un préavis d’un jour par semaine de contrat, dans la limite de deux semaines).</td></tr>
    <tr><td><b>Rupture de la période d’essai</b></td><td>L’un ou l’autre</td><td>Sans motif, en respectant un délai de prévenance (art. L1221-25 et L1221-26).</td></tr>
    <tr><td><b>Fin d’un contrat de prestation</b> (indépendant)</td><td>L’un ou l’autre</td><td>Droit civil : on applique ce que prévoit le contrat (terme, préavis, résiliation). Pas de licenciement ni de démission.</td></tr>
   </tbody></table></div>
   <p class="src">Source : ${LEGI}. Pour les démarches : <a href="https://www.service-public.fr" target="_blank" rel="noopener">service-public.fr</a>.</p>`},
  {id:'r17', tag:'Ressource 17', t:'Les documents de fin de contrat', th:'paie', html:()=>`
   <h3>Ce que l’employeur remet au salarié qui part</h3>
   <p><b>Le certificat de travail</b> (art. L1234-19) : il indique les dates d’entrée et de sortie et les emplois occupés.</p>
   <p><b>L’attestation destinée à France Travail</b> (art. R1234-9) : elle permet de faire valoir ses droits à l’assurance chômage lorsqu’on y a droit.</p>
   <p><b>Le reçu pour solde de tout compte</b> (art. L1234-20) : il fait l’inventaire des sommes versées au moment de la rupture (dernier salaire, indemnité de congés payés non pris, éventuelles indemnités).</p>
   <p class="src">Source : ${LEGI}.</p>`}
 ],
 cours:`<h3>Rompre un CDI</h3>
  <p><b>La démission</b> vient du salarié : sa volonté doit être claire et non équivoque. Il respecte un préavis (prévu par la convention collective ou les usages). <b>Le licenciement</b> vient de l’employeur : il exige une cause réelle et sérieuse et une procédure (entretien préalable, lettre motivée). <b>La rupture conventionnelle</b> repose sur l’accord des deux parties, avec un délai de rétractation de 15 jours calendaires et une homologation par l’administration.</p>
  <h3>Rompre un CDD</h3>
  <p>En principe, un CDD va jusqu’à son terme. Il ne peut être rompu avant que dans des cas précis : accord des parties, faute grave, force majeure, inaptitude, ou embauche du salarié en CDI.</p>
  <h3>Finir une relation d’indépendant</h3>
  <p>Le contrat de prestation se termine selon ses propres clauses (droit civil). L’indépendant n’a ni préavis légal du Code du travail, ni indemnité de licenciement.</p>
  <h3>Les documents de fin de contrat</h3>
  <p>Certificat de travail, attestation France Travail, reçu pour solde de tout compte : quel que soit le mode de rupture du contrat de travail.</p>`,

}
function blockKeys(b){
  const out=[];
  if(b.t==='fields') b.items.forEach(it=>out.push(it.k));
  if(b.t==='table'){ b.rowLabels.forEach((_,r)=>b.cols.slice(1).forEach((_,c)=>out.push(`${b.k}_${r}_${c}`))); }
  if(b.t==='calc') b.items.forEach(it=>out.push(it.k));
  return out;
}
const filled = k => S.f[k]!==undefined && String(S.f[k]).trim()!=='';
function annexePct(m){ const ks=m.annexe.blocks.flatMap(blockKeys); return ks.length?Math.round(100*ks.filter(filled).length/ks.length):0; }
function autoLevels(m){ return m.auto.crit.map((_,i)=>S.f[`ae_${m.id}_c${i}`]).filter(v=>v!==undefined && v!=='').map(Number); }
function autoPct(m){ return Math.round(100*autoLevels(m).length/m.auto.crit.length); }
function autoMean(m){ const l=autoLevels(m); return l.length? l.reduce((a,b)=>a+b,0)/l.length : null; }
function quizState(m){ let done=0, good=0; m.quiz.forEach((q,i)=>{ const v=S.f[`q_${m.id}_${i}`]; if(v!==undefined){ done++; if(v===true || (!q.type && Number(v)===q.a)) good++; } }); return {done,good,total:m.quiz.length}; }
function quizStars(m){ const q=quizState(m); if(q.done<q.total) return 0; const p=q.good/q.total; return p>=.8?3:p>=.6?2:1; }
function missionPct(m){ const q=quizState(m); return Math.round(annexePct(m)*.5 + autoPct(m)*.25 + 100*q.done/q.total*.25); }
function overallPct(){ return Math.round(M.reduce((a,m)=>a+missionPct(m),0)/M.length); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2600); }
function copyText(txt, okMsg){
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); toast(ok?okMsg:'Copie impossible ici : sélectionne le texte à la main.'); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast(okMsg),fallback); }catch(e){ fallback(); }
}

function parseNum(s){ const t=String(s).replace(/\s/g,'').replace(',','.'); const mm=t.match(/[-+]?\d+(\.\d+)?/); return mm?parseFloat(mm[0]):null; }

/* ═══════════ CONFETTIS ═══════════ */
const fx=$('#fx'), fxc=fx.getContext('2d'); let parts=[], fxRun=false;
function sizeFx(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; }
sizeFx(); addEventListener('resize',sizeFx);
function burst(x,y,n=90){
  if(RM) return;
  const cols=['#0E7C86','#F2AE10','#7B4FD6','#D9531F','#3CC4CC','#1C9A5E'];
  x=(x ?? innerWidth/2)*devicePixelRatio; y=(y ?? innerHeight/3)*devicePixelRatio;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=(4+Math.random()*9)*devicePixelRatio;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6*devicePixelRatio,r:(4+Math.random()*5)*devicePixelRatio,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3,sh:i%2,life:1}); }
  if(!fxRun){ fxRun=true; requestAnimationFrame(tickFx); }
}
function tickFx(){
  fxc.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{ p.vy+=.35*devicePixelRatio; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=.008;
    fxc.save(); fxc.globalAlpha=Math.max(p.life,0); fxc.translate(p.x,p.y); fxc.rotate(p.rot); fxc.fillStyle=p.c;
    if(p.sh===0) fxc.fillRect(-p.r,-p.r/2,p.r*2,p.r); else { fxc.beginPath(); fxc.arc(0,0,p.r*.7,0,7); fxc.fill(); }
    fxc.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<fx.height+50);
  if(parts.length) requestAnimationFrame(tickFx); else { fxRun=false; fxc.clearRect(0,0,fx.width,fx.height); }
}

function renderScore(P,m,celebrate){

function renderQ(P,m,i){
  const q=m.quiz[i], el=$(`#q-${i}`,P), key=`q_${m.id}_${i}`, val=S.f[key];
  const head=`<div class="qn">Question ${i+1}</div><h4>${q.q}</h4>`;
  const after=()=>{ save(); updateRing(); renderQ(P,m,i); renderScore(P,m,true); const t=$('.tabs [data-tab="defi"]'); if(t && tabDone(m,'defi') && !$('.dot',t)) t.insertAdjacentHTML('beforeend','<span class="dot"></span>'); };
  if(!q.type){
    const ans=val!==undefined;
    el.innerHTML=head+`<div class="opts">${q.o.map((o,j)=>{ let c=''; if(ans){ if(j===q.a) c='good'; else if(j===Number(val)) c='bad'; } return `<button class="opt ${c}" data-j="${j}" ${ans?'disabled':''}><span class="l">${'ABCD'[j]}</span>${o}</button>`; }).join('')}</div>${ans?`<div class="exp"><b>${Number(val)===q.a?'Bonne réponse.':'Pas tout à fait.'}</b> ${q.e}</div>`:''}`;
    if(!ans) $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{ S.f[key]=Number(b.dataset.j); if(Number(b.dataset.j)===q.a){ const r=b.getBoundingClientRect(); burst(r.left+30,r.top,24); } after(); }));
  } else if(q.type==='sort'){
    const ans=val!==undefined; const pick=S['sort_'+key]||{};
    el.innerHTML=head+`<div class="grid" style="gap:8px">${q.items.map(([t,b],j)=>{ const c=ans?(pick[j]===b?'good':'bad'):''; return `<div class="sortrow ${c}"><span>${t}${ans&&pick[j]!==b?` <small class="muted">(réponse : ${q.bins[b]})</small>`:''}</span><div class="bins">${q.bins.map((bn,bi)=>`<button data-j="${j}" data-b="${bi}" aria-pressed="${pick[j]===bi}" ${ans?'disabled':''}>${bn}</button>`).join('')}</div></div>`; }).join('')}</div>${ans?`<div class="exp"><b>${val===true?'Tout est juste !':'Quelques erreurs, corrigées ci-dessus.'}</b> ${q.e}</div>`:`<div><button class="btn small" data-check>Vérifier</button></div>`}`;
    if(!ans){
      $$('.bins button',el).forEach(b=>b.addEventListener('click',()=>{ pick[+b.dataset.j]=+b.dataset.b; S['sort_'+key]=pick; $$(`.bins button[data-j="${b.dataset.j}"]`,el).forEach(x=>x.setAttribute('aria-pressed',x===b)); }));
      $('[data-check]',el).addEventListener('click',()=>{ if(Object.keys(pick).length<q.items.length){ toast('Classe tous les éléments avant de vérifier.'); return; } S['sort_'+key]=pick; S.f[key]=q.items.every(([t,b],j)=>pick[j]===b); after(); });
    }
  } else if(q.type==='order'){
    const ans=val!==undefined; let seq=S['ord_'+key]||[];
    const shuf=S['shuf_'+key]||(S['shuf_'+key]=q.items.map((_,j)=>j).sort(()=>Math.random()-.5));
    const draw=()=>{
      el.innerHTML=head+`<div class="muted" style="font-size:14px">Clique dans l’ordre</div><div class="order-pool">${shuf.filter(j=>!seq.includes(j)).map(j=>`<button data-j="${j}" ${ans?'disabled':''}>${q.items[j]}</button>`).join('')}</div>
      <div class="order-out" aria-label="Ton ordre">${seq.map((j,n)=>`<button data-o="${n}" ${ans?'disabled':''}>${n+1}. ${q.items[j]}</button>`).join('')||'<span class="muted">Ton ordre apparaîtra ici.</span>'}</div>
      ${ans?`<div class="exp"><b>${val===true?'Ordre parfait !':'Ordre correct : '+q.items.join(', puis ')+'.'}</b> ${q.e}</div>`:`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-check>Vérifier</button><button class="btn ghost small" data-clear>Effacer</button></div>`}`;
      if(ans) return;
      $$('.order-pool button',el).forEach(b=>b.addEventListener('click',()=>{ seq.push(+b.dataset.j); S['ord_'+key]=seq; draw(); }));
      $$('.order-out button',el).forEach(b=>b.addEventListener('click',()=>{ seq.splice(+b.dataset.o,1); S['ord_'+key]=seq; draw(); }));
      $('[data-clear]',el).addEventListener('click',()=>{ seq=[]; S['ord_'+key]=seq; draw(); });
      $('[data-check]',el).addEventListener('click',()=>{ if(seq.length<q.items.length){ toast('Place tous les éléments avant de vérifier.'); return; } S.f[key]=seq.every((j,n)=>j===n); after(); });
    };
    draw();
  }
}

function calcItem(m,k){ for(const b of m.annexe.blocks) if(b.t==='calc'){ const it=b.items.find(x=>x.k===k); if(it) return it; } return null; }
function checkCalc(m,k,show){
  const it=calcItem(m,k), fb=$('#fb-'+k); if(!it||!fb) return;
  const v=parseNum(F(k));
  if(v===null){ fb.textContent=show?'Écris un nombre.':''; fb.className='fb ko'; return; }
  const ok=Math.abs(v-it.v)<=it.tol;
  fb.textContent=ok?'Juste !':'À revoir'; fb.className='fb '+(ok?'ok':'ko');
  if(ok && show){ const r=fb.getBoundingClientRect(); burst(r.left,r.top,20); }
}
function refreshCalcs(P){ const m=M.find(x=>x.id===location.hash.slice(1)); if(!m) return; m.annexe.blocks.filter(b=>b.t==='calc').forEach(b=>b.items.forEach(it=>{ if(filled(it.k)) checkCalc(m,it.k,false); })); }
function updateMeter(an){ if(!an) return; const m=M.find(x=>x.id===location.hash.slice(1)); if(!m) return; const p=annexePct(m); const i=$('.meter i',an); if(i){ i.style.width=p+'%'; $('.meter .pct',an).textContent=p+' %'; }
  if(p>=100 && !S['cel_'+m.id]){ S['cel_'+m.id]=true; save(); burst(); toast(`Annexe ${m.annexe.n} complète, bravo !`); } }
function annexeText(m){
  const a=m.annexe; const L=[`ANNEXE ${a.n} : ${a.title.toUpperCase()}`,`Élève : ${F('eleve_nom')}  Classe : ${F('eleve_classe')}`,''];
  a.blocks.forEach(b=>{
    if(b.t==='tip') return;
    L.push('— '+b.title);
    if(b.t==='fields') b.items.forEach(it=>L.push(`${it.l} : ${F(it.k)}`));
    if(b.t==='calc') b.items.forEach(it=>L.push(`${it.l} : ${F(it.k)} ${F(it.k)?it.u:''}`));
    if(b.t==='table') b.rowLabels.forEach((rl,r)=>L.push(`${rl} : `+b.cols.slice(1).map((c,ci)=>`${c} = ${F(`${b.k}_${r}_${ci}`)}`).join(' | ')));
    L.push('');
  });
  return L.join('\n');
}

function atDetecteur(el){
  const CASES={
    ines:{n:'Inès',a:[1,1,1,1,1,1]},
    karim:{n:'Karim (aujourd’hui)',a:[0,0,0,0,0,0]},
    karim2:{n:'Karim chez « Âge Tendre »',a:[1,1,1,1,0,1]},
    libre:{n:'Mon cas',a:[null,null,null,null,null,null]}
  };
  const Q=['Quelqu’un d’autre fixe ses horaires et son planning','On lui impose sa façon de travailler (consignes, tenue)','Son travail est contrôlé (comptes rendus, vérifications)','Il ou elle peut être sanctionné(e)','Le matériel lui est fourni','Il ou elle travaille pour un seul donneur d’ordre'];
  const W=[3,2,2,3,1,1];
  let cur='ines', ans=[...CASES.ines.a];
  const draw=()=>{
    const score=ans.reduce((s,v,i)=>s+(v===1?W[i]:0),0), max=W.reduce((a,b)=>a+b,0), pct=Math.round(100*score/max);
    const verdict = ans.some(v=>v===null)?'Réponds à toutes les questions.':pct>=65?'Fort lien de subordination : cela ressemble à un contrat de travail.':pct>=35?'Situation ambiguë : un juge examinerait les faits en détail.':'Peu ou pas de subordination : cela ressemble à du travail indépendant.';
    el.innerHTML=`<div class="checks" style="margin-bottom:14px">${Object.entries(CASES).map(([k,c])=>`<button class="btn ${k===cur?'':'ghost'} small" data-case="${k}">${c.n}</button>`).join('')}</div>
    <div class="grid" style="gap:8px">${Q.map((q,i)=>`<div class="toggle-row"><span>${q}</span><div class="seg"><button data-q="${i}" data-v="1" aria-pressed="${ans[i]===1}">Oui</button><button data-q="${i}" data-v="0" aria-pressed="${ans[i]===0}">Non</button></div></div>`).join('')}</div>
    <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px"><span>Indépendant</span><span>Salarié</span></div><div class="gaugebar"><i style="left:calc(${ans.some(v=>v===null)?50:pct}% - 3px)"></i></div><p><b>${verdict}</b></p><p class="muted" style="margin-top:6px;font-size:14px">Le pouvoir de donner des ordres, de contrôler et de sanctionner pèse le plus lourd : ce sont les trois éléments de la définition de la Cour de cassation. Ce détecteur est un outil d’entraînement, pas une décision juridique.</p></div>`;
